{
  "mode": "deliver",
  "output_language": "zh-CN",
  "output_format": "markdown",
  "source_config": "sources/rss_sources.yaml",
  "max_items_per_source": 5,
  "max_ranked_items": 20,
  "request_pause_seconds": 0.3,
  "focus_assets": ["USD", "JPY", "CNY", "Gold", "Oil", "Bonds", "Equities"],
  "output_dir": "output/daily-email-output/",
  "log_path": "logs/daily-workflow.jsonl",
  "deliver_email": true,
  "market_data": {
    "enabled": true,
    "provider": "yfinance",
    "source_config": "sources/market_sources.yaml",
    "period": "3mo",
    "interval": "1d"
  },
  "email": {
    "from": "REPLACE_WITH_SENDER",
    "to": "REPLACE_WITH_RECIPIENT",
    "send": false
  },
  "filters": {},
  "graph": {
    "research_max_items": 10,
    "official_max_items": 10,
    "media_max_items": 20,
    "tech_max_items": 6,
    "google_max_items": 6,
    "hot_max_items": 5,
    "max_quality_retries": 2,
    "recursion_limit": 20,
    "country_balance": {"CN": 4, "US": 4, "JP": 4, "default": 99}
  }
}
