# Stock watchlist — individual stocks that trigger market-mover news searches.
#
# These symbols are fetched with the market data, but they are NOT shown in the
# trend table: they only trigger a targeted Google News search (the 异动解读 section)
# when their 1-day or 1-week move crosses the `movers` thresholds.
#
# Edit freely. Under Hermes the plugin copies this file once to
#   <HERMES_HOME>/plugin-data/EconomicNewsAnalysis/stock_watchlist.yaml
# and reads that copy, so your edits survive plugin reinstalls and upgrades.
# Delete that copy to get this default list back on the next run.
#
# Fields per stock:
#   id        unique key (lowercase, no spaces)           required
#   ticker    Yahoo Finance ticker, e.g. NVDA, 7203.T, 0700.HK   required
#   name      English name, used in the news search query  required
#   region    US / JP / HK / CN ...                         required
#   name_zh   Chinese display name                          optional
#   currency  USD / JPY / HKD ...                           optional
# asset_class defaults to equity_stock, asset_type to price, display_precision to 2.

