# Hermes daily email orchestration guide.
#
# The daily email is produced by the native Hermes plugin tool `run_langgraph_workflow`
# with {"run_mode": "deliver", "profile_config": "daily_email"} (installation and
# acceptance order: docs/HERMES-FIRST-INSTALL.md). One call does the whole job: the
# quality gate auto-enriches missing signals and synthesizes the mainlines and the
# market-impact map, and the delivery node builds and sends the email.
#
# The plugin maps "daily_email" to the daily_email_briefing.yaml template in the
# repository root; it accepts no config path or email settings from the model.
#
# The command line (`python -m tools.runtime`) has no Hermes `ctx.llm`, so its LLM steps
# fail and the run degrades. Use it only for fetch/market checks, never as the daily job.
workflow: daily-email-briefing
version: 3
workspace: REPLACE_WITH_HERMES_PROFILE_ROOT/skills/EconomicNewsAnalysis

steps:
  - id: prepare_deployed_config
    input: daily_email_briefing.yaml (template, email.send false) + private email settings
    output: deployed copy of the template, read by the plugin inside the Hermes profile
    rules:
      - 邮件参数在配置的 email 块里（from/to/send）；subject 可省略——deliver 运行会自动生成
        「📊 财经消息 日报 <日期>」主题（日期按 JST）。
      - 仓库里的模板是占位符加 send:false；真实收件人只在受控的 Hermes 环境里补齐，
        不得提交或写入仓库。
  - id: deliver
    # 一步到位：抓取 -> 标准化/去重 -> 排序 -> LLM 分析 -> 质量门（自动补信号、
    # 合成主线与市场影响地图）-> 生成简报 -> 写出 md/json -> 构建邮件 -> 发信（himalaya 或内置 SMTP）。
    tool: run_langgraph_workflow
    arguments: {"run_mode": "deliver", "profile_config": "daily_email"}
    requires: [prepare_deployed_config]
    produces: [<topic>_<ts>.md, <run_id>_runtime.json]

guards:
  - 只发送本次 deliver 运行生成的邮件；不得发送历史草稿或旧版 Agent Markdown。
  - 质量门不通过不会阻断发送：先重试，超限后降级；邮件内带「部分成功」提示，
    pipeline_status 为 partial_success，具体问题在 _quality_gate.issues 里（缺少核心信号、
    标题未翻译、主线数量不合规、市场影响字段不全）。
  - 未核验 Google News 链接标记为「Google News 发现链接」，不得标为「发布页」。
  - 发信方式由 email.transport 决定：command（默认）走 himalaya，需要配好 himalaya 的 WSL/Linux profile；
    smtp 走内置客户端，原生 Windows 也能发。配置见 references/smtp-setup.md。

# ── 真发前检查清单 ─────────────────────────────────────────────────────────────
# 按部署副本里的 email.transport 只做对应的那一条发信检查。
preflight_checklist:
  环境_一次性:
    - 进仓库：cd REPLACE_WITH_REPO_PATH
    - WSL：重建 Linux venv（原 .venv 是 Windows 版，WSL 用不了）：uv sync
    - transport 为 command（默认）时：himalaya account list 能列出含 REPLACE_WITH_PRIVATE_EMAIL 的发件账户
    - transport 为 smtp 时：部署副本里填好 email.smtp.host；password_env 指向的环境变量或 password_file
      指向的文件在 Hermes 进程里可读且非空；配置里不写 password 字段
    - LLM 由 Hermes 的 ctx.llm 提供（见 docs/HERMES-FIRST-INSTALL.md），本仓库不再读取任何 API key
  step1_离线冒烟_零成本:
    - uv run python -m tools.workflow_smoke 应输出 6/6 workflows passed、exit 0
    - 失败看 logs/workflow_smoke.jsonl 末尾的 error_type / traceback
  step2_live_dry_run_不发:
    - uv run python -m tools.workflow_smoke --live --only daily-email-briefing
    - （--live 做真实 RSS 抓取和 yfinance 行情；命令行里没有 Hermes ctx.llm，LLM 分析会失败并走降级，
      所以这一步只验证抓取与行情，不要求 items_analyzed > 0；冒烟强制 email.send=false，只构建不投递）
    - 含 LLM 的端到端验证请在 Hermes 里通过插件工具完成（docs/HERMES-FIRST-INSTALL.md 的验收顺序）
  step3_真发:
    - '在 Hermes 里由 Cron 调用 run_langgraph_workflow，参数 {"run_mode": "deliver", "profile_config": "daily_email"}
      （部署副本里已补齐收件人并设 send: true；仓库里的模板是 send: false）'
    - 'deliver / check 的工具返回值是几 KB 的精简摘要（result_kind: summary，状态字段在最前，含 full_result_path）；
      完整的 items / analyses / briefing_markdown 在 output_files.json 指向的 <run_id>_runtime.json 里'
    - command 方式：出现 "Message successfully sent!"（himalaya 成功标志）；smtp 方式没有这行输出，以下一条为准
    - 结果里没有「邮件发送失败」告警，且 pipeline_status 不是 partial_success（若是，看 _quality_gate.issues）
  step4_收件核对:
    - 主题含 📊，形如「📊 财经消息 日报 YYYY-MM-DD」
    - 市场趋势表出现且仅一次（不重复）
    - 今日资讯主线 1–5 条，非空
    - 🌏 官媒宏观背景（中美日）三段都在（中/美/日）
    - 市场影响地图 5 项均为真实分析（非「等待基于已核验来源…」占位符）
    - 财经媒体 / 科技与AI / 热点速览 等板块按内容显示，无内容时为「暂无…」占位
    - 标题/正文为中文（无英文原标题、无「待 Agent 忠实翻译」）
    - 关注资产为中文资产名（黄金、美国国债…），仅通用代码保留（USD/CNY/JPY…）
    - 本周观察指标为纯文本（无 验证：{'signal':...} 原始 dict）
    - 页脚「自动生成」仅一次；邮件正文整体居中
  排错:
    - 跑不通/异常：先跑 python -m tools.workflow_smoke 定位；看 logs/workflow_smoke.jsonl
    - 超时：调 graph.llm_concurrency（默认 12，供应商限频时调低）或加长 Hermes 调用超时
    - 空转/循环：max_quality_retries:2 + recursion_limit:20 已兜底；超限以 GraphRecursionError → status:failed 终止
    - 发不出但内容正常：先看「邮件发送失败:」告警（command 方式带命令的 stderr，smtp 方式带异常类型和服务器回复），
      再查 himalaya 账户/凭证或 SMTP 密码、email.from 是否匹配账户、网络
    - LLM 不可用：命令行没有 ctx.llm；改用 Hermes 插件运行，并看返回的 llm_audit 里每个节点实际用的 provider/model
