[project]
name = "economic-news-analysis"
version = "0.9.1"
description = "LangGraph workflow for economic news analysis and market context."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "yfinance>=0.2.0",
  "langgraph>=0.4.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "PyYAML>=6.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "typing-extensions>=4.7; python_version < '3.11'",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = [
  "tools",
  "tools.graph",
  "tools.market_data",
  "tools.market_data.providers",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
# Long string literals and comments are left to the formatter's judgement.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
