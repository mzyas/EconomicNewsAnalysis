name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies (with dev group)
        run: uv sync --group dev

      - name: Run pytest
        run: uv run python -m pytest

      # Offline smoke: stubbed LLM, no fetch / no email / no API cost, so no
      # secrets are needed. A non-zero exit fails the job; --alert-on-fail also
      # records the failure to logs/ (uploaded below).
      - name: Workflow smoke test (offline)
        run: uv run python tools/workflow_smoke.py --alert-on-fail

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-logs
          path: logs/
          if-no-files-found: ignore
